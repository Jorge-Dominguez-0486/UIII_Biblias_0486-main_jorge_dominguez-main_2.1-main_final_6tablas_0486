{% extends 'base.html' %}
{% block content %}
<h3>Agregar a Inventario</h3>
<form method="POST">
  {% csrf_token %}
  <div class="mb-3">
    <label>Producto</label>
    <select class="form-control" name="producto" required>
      <option value="">-- Seleccionar Producto (solo sin inventario) --</option>
      {% for p in productos %}
        <option value="{{ p.id }}">{{ p.nombre }} ({{p.isbo}})</option>
      {% endfor %}
    </select>
  </div>
  <div class="row">
    <div class="col-md-8 mb-3">
      <label>Ubicación en Almacén</label>
      <input class="form-control" name="almacen_ubicacion" placeholder="Ej: Pasillo A, Estante 3" required>
    </div>
    <div class="col-md-4 mb-3">
      <label>Cantidad Disponible</label>
      <input class="form-control" name="cantidad_disponible" type="number" value="0" required>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Costo Unitario</label>
      <input class="form-control" name="costo_unitario" type="number" step="0.01" value="0.00" required>
    </div>
    <div class="col-md-4 mb-3">
      <label>Mínimo Stock</label>
      <input class="form-control" name="minimo_stock" type="number" value="0" required>
    </div>
    <div class="col-md-4 mb-3">
      <label>Máximo Stock</label>
      <input class="form-control" name="maximo_stock" type="number" value="100" required>
    </div>
  </div>
  <div class="mb-3">
    <label>Fecha de Recepción</label>
    <input class="form-control" name="fecha_recepcion" type="date">
  </div>
  <button class="btn btn-primary" type="submit">Agregar Inventario</button>
</form>
{% endblock %}
